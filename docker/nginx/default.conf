server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  default_type application/octet-stream;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }

  # Sites without their own downloads page get the image's.
  location = / {
    try_files /index.html @default_page;
    add_header Cache-Control "no-cache" always;
  }

  location @default_page {
    root /usr/share/nginx/default;
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
  }

  location /data/ {
    autoindex on;
    add_header Cache-Control "no-cache" always;
  }

  location /data/objects/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /launcher/ {
    autoindex on;
    add_header Cache-Control "no-cache" always;
  }

  # Old launchers update themselves through the removed backend API and legacy paths.
  location = /api/v1/launchers/windows/exe {
    alias /usr/share/nginx/html/launcher/windows/launcher.exe;
  }
  location = /api/v1/launchers/windows/exe/version {
    alias /usr/share/nginx/html/launcher/windows/version.txt;
  }
  location = /api/v1/launchers/linux/bin {
    alias /usr/share/nginx/html/launcher/linux/launcher;
  }
  location = /api/v1/launchers/linux/bin/version {
    alias /usr/share/nginx/html/launcher/linux/version.txt;
  }
  location = /api/v1/launchers/linux/flatpak {
    alias /usr/share/nginx/html/launcher/linux/launcher.flatpak;
  }
  location = /api/v1/launchers/linux/flatpak/version {
    alias /usr/share/nginx/html/launcher/linux/version.txt;
  }
  location = /api/v1/launchers/macos/archive {
    alias /usr/share/nginx/html/launcher/macos/launcher_macos.tar.gz;
  }
  location = /api/v1/launchers/macos/archive/version {
    alias /usr/share/nginx/html/launcher/macos/version.txt;
  }
  location = /api/v1/launchers/macos/dmg {
    alias /usr/share/nginx/html/launcher/macos/launcher.dmg;
  }
  location = /api/v1/launchers/macos/dmg/version {
    alias /usr/share/nginx/html/launcher/macos/version.txt;
  }

  location = /version_windows.txt { rewrite ^ /api/v1/launchers/windows/exe/version last; }
  location = /version_linux.txt   { rewrite ^ /api/v1/launchers/linux/bin/version last; }
  location = /version_macos.txt   { rewrite ^ /api/v1/launchers/macos/archive/version last; }

  location ~ ^/[^/]*launcher[^/]*\.exe$ { rewrite ^ /api/v1/launchers/windows/exe last; }
  location ~ ^/[^/]*launcher[^/]*_macos\.tar\.gz$ { rewrite ^ /api/v1/launchers/macos/archive last; }
  location ~ ^/(?!launcher$)[^/\.]*launcher[^/\.]*$ { rewrite ^ /api/v1/launchers/linux/bin last; }
}
