name: Build launcher

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

defaults:
  run:
    shell: bash

env:
  LAUNCHER_NAME: ${{ vars.LAUNCHER_NAME }}
  LAUNCHER_APP_ID: ${{ vars.LAUNCHER_APP_ID }}
  LAUNCHER_ICON: ${{ vars.LAUNCHER_ICON }}
  LAUNCHER_DATA_DIR: ${{ vars.LAUNCHER_DATA_DIR }}
  LAUNCHER_DESCRIPTION: ${{ vars.LAUNCHER_DESCRIPTION }}
  INSTANCE_MANIFEST_URLS: ${{ vars.INSTANCE_MANIFEST_URLS }}
  LAUNCHER_UPDATE_URL: ${{ vars.LAUNCHER_UPDATE_URL }}
  LAUNCHER_UPDATE_GITHUB: ${{ vars.LAUNCHER_UPDATE_GITHUB }}

jobs:
  check:
    uses: ./.github/workflows/check.yml

  binaries:
    name: Build binaries
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "ubuntu-latest", "macos-latest"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/ci/install-linux-deps.sh

      - name: Install packaging dependencies
        run: ./scripts/ci/install-packaging-deps.sh

      - name: Resolve build environment
        run: ./scripts/ci/set-build-env.sh

      - name: Configure packaging
        run: python packaging/configure.py

      - name: Build the launcher
        run: ./scripts/ci/build-launcher.sh

      - name: Build potato
        if: runner.os != 'Windows'
        run: |
          cargo build -p potato --profile release-lto
          os="$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')"
          mkdir -p build-potato
          cp target/release-lto/potato "build-potato/potato-${os}-$(uname -m)"

      - name: Upload launcher artifacts
        uses: actions/upload-artifact@v7
        with:
          name: launcher-${{ matrix.os }}
          path: build/*

      - name: Upload potato artifact
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: potato-${{ matrix.os }}
          path: build-potato/*

  flatpak:
    name: Build Flatpak package
    needs: check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/rust:25.08
      options: --privileged
    env:
      FLATPAK_KEYWORDS: ${{ vars.FLATPAK_KEYWORDS }}

    steps:
      - uses: actions/checkout@v7

      - name: Install packaging dependencies
        run: ./scripts/ci/install-packaging-deps.sh

      - name: Resolve build environment
        run: ./scripts/ci/set-build-env.sh

      - name: Install flatpak-cargo-generator dependencies
        run: dnf install -y python3-aiohttp python3-toml wget

      - name: Generate cargo sources
        run: ./scripts/ci/flatpak-sources.sh

      - name: Generate manifest
        run: ./scripts/ci/flatpak-manifest.sh

      - name: Setup GPG
        id: gpg
        # `if` doesn't see secrets directly, so the key is mirrored into env first.
        if: ${{ github.ref_type == 'tag' && env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build Flatpak package
        uses: andyholmes/flatter@main
        with:
          files: |
            packaging/flatpak/manifest.yml
          arch: x86_64
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true

      - name: Collect Flatpak bundle
        run: |
          bundle="$(ls -1 ./*.flatpak | head -n1)"
          mkdir -p build
          cp "$bundle" "build/${LOWER_LAUNCHER_NAME}.flatpak"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        with:
          name: launcher-flatpak
          path: build/*

  release:
    name: Release
    if: ${{ github.ref_type == 'tag' }}
    needs: [binaries, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve build environment
        run: ./scripts/ci/set-build-env.sh

      - uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          merge-multiple: true
          path: release/launcher

      - uses: actions/download-artifact@v7
        with:
          pattern: potato-*
          merge-multiple: true
          path: release/potato

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" release/launcher/* release/potato/* \
            --title "$VERSION" --generate-notes --verify-tag

      - name: Publish to storage
        if: ${{ vars.LAUNCHER_PUBLISH_TARGET != '' }}
        env:
          LAUNCHER_PUBLISH_TARGET: ${{ vars.LAUNCHER_PUBLISH_TARGET }}
          LAUNCHER_PUBLISH_SSH_KEY: ${{ secrets.LAUNCHER_PUBLISH_SSH_KEY }}
          LAUNCHER_PUBLISH_KNOWN_HOSTS: ${{ vars.LAUNCHER_PUBLISH_KNOWN_HOSTS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
        run: |
          export POTATO=release/potato/potato-linux-x86_64
          chmod +x "$POTATO"
          ./scripts/ci/publish-launcher.sh
