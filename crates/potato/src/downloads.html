<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
{{favicon}}
<style>
:root {
  color-scheme: light dark;
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #09090b;
  --muted: #71717a;
  --border: #e4e4e7;
  --hover: #f4f4f5;
  --primary: #18181b;
  --primary-fg: #fafafa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --card: #111113;
    --fg: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --hover: #1c1c1f;
    --primary: #fafafa;
    --primary-fg: #18181b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  width: 100%;
  max-width: 56rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
}
header { text-align: center; padding: 40px 24px 8px; }
.logo { width: 96px; height: 96px; margin-bottom: 16px; }
h1 { margin: 0; font-size: 2.25rem; line-height: 1.2; }
.subtitle { margin: 12px 0 0; color: var(--muted); font-size: 1.125rem; }
.version { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
.downloads {
  display: grid;
  grid-template-columns: 1fr;
  gap: 24px;
  padding: 32px 24px;
}
@media (min-width: 720px) {
  .downloads { grid-template-columns: 1fr 1fr; padding: 32px; }
  .download:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; width: calc(50% - 12px); }
  .manifest { padding: 0 32px 32px; }
}
.download {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  border: 1px solid var(--border);
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  text-align: center;
  transition: background-color 0.15s, border-color 0.15s;
}
.download:hover { background: var(--hover); }
.download svg { flex: none; width: 56px; height: 56px; margin-bottom: 16px; }
.title { font-size: 1.25rem; font-weight: 600; line-height: 1.4; }
.detail { margin: 4px 0 20px; color: var(--muted); font-size: 0.875rem; }
.tag {
  display: none;
  position: absolute;
  top: 12px;
  right: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--primary);
  color: var(--primary-fg);
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.button {
  width: 100%;
  margin-top: auto;
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-weight: 500;
}
.current { border-color: var(--primary); }
.current .tag { display: block; }
.current .button { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
footer { padding: 24px; border-top: 1px solid var(--border); text-align: center; }
footer a { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; }
footer a:hover { color: var(--fg); }
footer svg { width: 20px; height: 20px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); }
.manifest { padding: 0 24px 32px; }
.manifest h2 { margin: 0 0 4px; font-size: 1.125rem; }
.manifest p { margin: 0 0 12px; color: var(--muted); font-size: 0.875rem; }
.copy { display: flex; gap: 8px; }
.copy input {
  flex: 1;
  min-width: 0;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--fg);
  font: 0.875rem ui-monospace, SFMono-Regular, Menlo, monospace;
}
.copy button {
  padding: 8px 16px;
  border: 1px solid var(--primary);
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-fg);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
}
</style>
</head>
<body>

</svg>
<main>
<header>
{{logo}}
<h1>{{name}}</h1>
<p class="subtitle">Download the launcher for your operating system</p>
{{version}}
</header>
<section class="downloads">
{{downloads}}
</section>
<section class="manifest" hidden>
<h2>Already have Potato Launcher?</h2>
<p>In the launcher, click <b>Configure backends</b>, paste this URL under <b>Add Backend</b> and click <b>Add Backend</b>.</p>
<div class="copy"><input readonly aria-label="Instance list URL"><button type="button">Copy</button></div>
</section>
{{source}}
</main>
<script>
const manifest = new URL("data/instance_manifest.json", location.href).href;
const box = document.querySelector(".manifest");
const input = box.querySelector("input");
const copy = box.querySelector("button");
input.value = manifest;
fetch(manifest, { method: "HEAD" }).then((response) => { box.hidden = !response.ok; });
copy.addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(manifest);
  } catch {
    input.select();
    document.execCommand("copy");
  }
  copy.textContent = "Copied";
  setTimeout(() => { copy.textContent = "Copy"; }, 1500);
});
const platform = (navigator.userAgentData?.platform || navigator.platform || navigator.userAgent).toLowerCase();
const os = platform.includes("win") ? "windows"
  : platform.includes("mac") ? "macos"
  : platform.includes("linux") ? "linux"
  : null;
const downloads = document.querySelector(".downloads");
if (os) {
  for (const card of [...downloads.querySelectorAll(`[data-os="${os}"]`)].reverse()) {
    card.classList.add("current");
    downloads.prepend(card);
  }
}
</script>
</body>
</html>
